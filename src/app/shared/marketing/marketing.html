<div
  class="sub-page"
  [style]="{ '--accent': app.accent, '--accent-light': app.accentLight, '--accent-dark': app.accentDark }"
>
  <header class="site-nav">
    <div class="nav-inner">
      <a class="nav-brand" routerLink="/">
        <span class="material-symbols-outlined brand-icon">grid_view</span>
        <span class="brand-name">Next Jedi</span>
      </a>
      <div class="nav-app">
        <span class="nav-sep">/</span>
        <a class="nav-app-link" [routerLink]="'/' + app.slug">{{ app.name }}</a>
        <span class="nav-sep">/</span>
        <span class="nav-page-name">Marketing</span>
      </div>
      <nav class="nav-global-links">
        <a class="nav-global-link" routerLink="/aurora">Project Aurora</a>
        <a class="nav-global-link" routerLink="/team">Meet the Team</a>
      </nav>
    </div>
  </header>

  <main class="sub-content">
    <div class="sub-inner">
      <a class="back-link" [routerLink]="'/' + app.slug">
        <span class="material-symbols-outlined">arrow_back</span>
        Back to {{ app.name }}
      </a>
      <p class="sub-eyebrow">{{ app.name }}</p>
      <h1>Marketing</h1>
      <p>Marketing assets and resources for {{ app.name }} are being prepared.</p>
    </div>
  </main>

  <app-footer [appName]="app.name" [appSlug]="app.slug" />
</div>
